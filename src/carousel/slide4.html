<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Slide 4 – Did You Know</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    background: #FFCC00;
    font-family: 'Poppins', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* subtle dot grid */
  .dot-grid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(0,0,0,0.12) 2px, transparent 2px);
    background-size: 40px 40px;
  }

  .card {
    background: #000;
    border-radius: 40px;
    width: 880px;
    padding: 80px;
    text-align: center;
    z-index: 2;
    position: relative;
  }

  .eyebrow {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #FFCC00;
    margin-bottom: 20px;
  }

  .icon-row {
    font-size: 64px;
    margin-bottom: 32px;
  }

  h2 {
    font-size: 56px;
    font-weight: 900;
    color: #FFFFFF;
    line-height: 1.1;
    margin-bottom: 24px;
  }

  h2 .yellow { color: #FFCC00; }

  .divider {
    width: 60px; height: 5px;
    background: #FFCC00;
    border-radius: 3px;
    margin: 0 auto 32px;
  }

  .stat {
    font-size: 120px;
    font-weight: 900;
    color: #FFCC00;
    line-height: 1;
    margin-bottom: 8px;
  }

  .stat-label {
    font-size: 28px;
    font-weight: 600;
    color: #ccc;
    margin-bottom: 40px;
    line-height: 1.4;
  }

  .source {
    font-size: 18px;
    font-weight: 500;
    color: #666;
    border-top: 1px solid #222;
    padding-top: 24px;
    margin-top: 8px;
  }

  /* corner accent squares */
  .corner {
    position: absolute;
    width: 60px; height: 60px;
    background: #000;
    z-index: 1;
  }
  .corner.tl { top: 0; left: 0; border-radius: 0 0 30px 0; }
  .corner.tr { top: 0; right: 0; border-radius: 0 0 0 30px; }
  .corner.bl { bottom: 0; left: 0; border-radius: 0 30px 0 0; }
  .corner.br { bottom: 0; right: 0; border-radius: 30px 0 0 0; }
</style>
</head>
<body>
  <div class="dot-grid"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="card">
    <div class="eyebrow">Did You Know?</div>
    <div class="icon-row">📊</div>
    <h2>Most Aussies leave <span class="yellow">free money</span> on the table</h2>
    <div class="divider"></div>
    <div class="stat">67%</div>
    <div class="stat-label">of Australians aren't using a high-interest<br>savings account for their emergency fund</div>
    <div class="source">Setting up a CommBank GoalSaver takes under 2 minutes in the app · @yourhandle</div>
  </div>
</body>
</html>
