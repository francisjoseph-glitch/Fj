<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Slide 3 – Home Loan Tip</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    background: #000000;
    font-family: 'Poppins', sans-serif;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* decorative top-right arc */
  .arc {
    position: absolute;
    top: -160px; right: -160px;
    width: 500px; height: 500px;
    border-radius: 50%;
    border: 40px solid #FFCC00;
    opacity: 0.18;
  }

  .arc2 {
    position: absolute;
    top: -60px; right: -60px;
    width: 280px; height: 280px;
    border-radius: 50%;
    border: 24px solid #FFCC00;
    opacity: 0.12;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px 90px;
    z-index: 2;
  }

  .tip-label {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 40px;
  }

  .tip-icon {
    width: 52px; height: 52px;
    background: #FFCC00;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }

  .tip-text {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #FFCC00;
  }

  h2 {
    font-size: 78px;
    font-weight: 900;
    color: #FFCC00;
    line-height: 1.05;
    margin-bottom: 44px;
  }

  .body-text {
    font-size: 30px;
    font-weight: 400;
    color: #CCCCCC;
    line-height: 1.6;
    margin-bottom: 50px;
    max-width: 860px;
  }

  .body-text strong {
    color: #FFFFFF;
    font-weight: 700;
  }

  .highlight-box {
    background: #1a1a1a;
    border-left: 8px solid #FFCC00;
    padding: 28px 36px;
    border-radius: 0 16px 16px 0;
    font-size: 26px;
    font-weight: 600;
    color: #FFF;
    max-width: 820px;
  }

  /* bottom yellow strip */
  .bottom-strip {
    height: 80px;
    background: #FFCC00;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 70px;
    flex-shrink: 0;
    z-index: 2;
  }

  .swipe-text {
    font-size: 26px;
    font-weight: 800;
    color: #000;
    letter-spacing: 1px;
  }

  .swipe-arrow {
    font-size: 32px;
  }

  .handle {
    font-size: 22px;
    font-weight: 700;
    color: #000;
  }
</style>
</head>
<body>
  <div class="arc"></div>
  <div class="arc2"></div>

  <div class="content">
    <div class="tip-label">
      <div class="tip-icon">🏠</div>
      <span class="tip-text">Home Loan Tip #1</span>
    </div>
    <h2>Offset accounts<br>can save you<br>thousands</h2>
    <p class="body-text">
      Linking an <strong>offset account</strong> to your CommBank home loan means the balance sits against your loan — reducing the interest you're charged every day.
    </p>
    <div class="highlight-box">
      💡 $20K in offset = ~$1,200 saved per year on a $500K loan at 6%
    </div>
  </div>

  <div class="bottom-strip">
    <span class="swipe-text">Swipe for more →</span>
    <span class="handle">@yourhandle</span>
  </div>
</body>
</html>
